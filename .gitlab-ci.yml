include:
  - project: tordu-jardin/cloud
    file: ci/deploy-static.gitlab-ci.yml

# Layout · the monorepo keeps the Astro site under site/, with public/
# symlinks back to the sibling rikiki/ and examples/ packages. The static
# template builds at BUILD_CONTEXT root, so a thin root package.json acts
# as the entry point for `COPY package.json package-lock.json && npm ci`
# (no deps · the root install is a no-op) and BUILD_CMD jumps into site/
# for the real build. BUILD_OUTPUT points at the nested dist/.
variables:
  STACK_NAME: 'rikiki'
  IMAGE_NAME: 'rikiki'
  NODE_VERSION: '24'
  # BUILD_CMD defaults to `npm run build` (template default) · the root
  # package.json's "build" script handles the cd-into-site dance. The old
  # post-step that swapped in the standalone Lit bundle is gone: dist/index.js
  # vendors its dependencies locally and no longer reaches any CDN.
  BUILD_OUTPUT: 'site/dist'
  # The site is statically generated, one file per route · an SPA fallback would
  # answer 200 with the homepage for every missing path, which makes every HTTP
  # check in smoke-test pass whatever is deployed.
  SPA_FALLBACK: 'false'
  # Base images pinned by sha256. Light supply-chain hygiene · a tag
  # refresh upstream no longer silently shifts the build under our feet.
  # Bump by hand when needed (run `docker pull <image>` to see the new
  # digest, paste it back here).
  NODE_IMAGE:  'node:24-alpine@sha256:d1b3b4da11eefd5941e7f0b9cf17783fc99d9c6fc34884a665f40a06dbdfc94f'
  NGINX_IMAGE: 'nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10'
  DOCKER_CLI_IMAGE: 'docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c'
  ALPINE_IMAGE: 'alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d'

stages: [check, build, deploy, release]

# Quality gate · em-dash linter + `astro check`. Runs before the (more
# expensive) Docker build so a TS error or a forbidden em-dash short-
# circuits the pipeline in ~25s instead of waiting for the Astro+Docker
# pass to fail much later.
lint:
  stage: check
  image: ${NODE_IMAGE}
  cache:
    key: site-node-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - site/node_modules/
  before_script:
    - cd site
    - npm ci --prefer-offline --no-audit
  script:
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Quality gate for the published npm package (the site job above only covers
# site/). Typecheck, lint (biome) and the consistency test suite. Runs in the
# same cheap `check` stage so a broken package short-circuits before the build.
package-check:
  stage: check
  image: ${NODE_IMAGE}
  cache:
    key: rikiki-node-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - rikiki/node_modules/
  before_script:
    - cd rikiki
    - npm ci --prefer-offline --no-audit
  script:
    - npm run typecheck
    - npm run lint
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Render net · loads every fixture deck in a real browser and asserts the
# engine upgrades, slides render, navigation works and content has no JS errors.
# Uses the official Playwright image (browsers + python3 for the static server)
# pinned to the installed @playwright/test version.
e2e:
  stage: check
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  cache:
    key: rikiki-node-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - rikiki/node_modules/
  before_script:
    - cd rikiki
    - npm ci --prefer-offline --no-audit
  script:
    - npm run build            # decks load ../../dist · build it first
    # The committed dist/ is what the deployed site and git consumers actually
    # run · a rebuild that differs means src/ and dist/ drifted, and the tests
    # below would green-light an artifact nobody ships. Fail fast instead.
    - git diff --exit-code -- dist || { echo "ERROR · committed dist/ is stale, run 'npm run build' and commit it"; exit 1; }
    - npx playwright test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - rikiki/e2e-report.json
      - rikiki/test-results/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Override the template's build-image job · the shared runner now selects
# the `docker-container` buildx driver by default, which does not load the
# built image into the local daemon. The template's plain `docker push`
# that follows then fails with "tag does not exist". We use `docker buildx
# build --push` so buildx pushes directly to the registry in one shot.
# The rest (image tags, build args, cache-from) is kept identical to the
# template so behaviour is otherwise unchanged.
build-image:
  stage: build
  image: ${DOCKER_CLI_IMAGE}
  variables:
    IMAGE: "${TJ_REGISTRY}/${IMAGE_NAME}"
    DOCKER_BUILDKIT: "1"
  before_script:
    - |
      for var in TJ_REGISTRY TJ_REGISTRY_USER TJ_REGISTRY_PASSWORD; do
        eval val=\$$var
        [ -z "$val" ] && echo "ERROR: $var is not set. Check runner config." && exit 1
      done
    - docker login "$TJ_REGISTRY" -u "$TJ_REGISTRY_USER" -p "$TJ_REGISTRY_PASSWORD"
  script:
    - |
      DOCKERFILE=".generated.Dockerfile"
      cat > "$DOCKERFILE" <<DOCKERFILE_EOF
      # syntax=docker/dockerfile:1
      FROM ${NODE_IMAGE} AS build
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN --mount=type=cache,target=/root/.npm npm ci
      COPY . .
      RUN ${BUILD_CMD}
      FROM ${NGINX_IMAGE}
      COPY --from=build /app/${BUILD_OUTPUT}/ /usr/share/nginx/html/
      RUN sed -i 's|application/javascript\s\+js;|application/javascript js mjs;|' /etc/nginx/mime.types
      DOCKERFILE_EOF
      cat >> "$DOCKERFILE" <<'SPA_EOF'
      RUN printf 'server {\n    listen 80;\n    root /usr/share/nginx/html;\n    location / { try_files $uri $uri/ /index.html; }\n}\n' > /etc/nginx/conf.d/default.conf
      EXPOSE 80
      HEALTHCHECK --interval=30s --timeout=3s --retries=3 \
          CMD wget -qO- http://127.0.0.1/ || exit 1
      SPA_EOF
    - |
      CACHE_FLAG=""
      if [ "$DOCKER_NO_CACHE" != "true" ]; then
        CACHE_FLAG="--cache-from $IMAGE:latest"
      fi
    - docker buildx build
        $CACHE_FLAG
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg "COMMIT_SHA=$CI_COMMIT_SHORT_SHA"
        -f .generated.Dockerfile
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA"
        -t "$IMAGE:latest"
        --push
        .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Smoke test · after Portainer recreates the stack, hit the public URL
# from outside and assert the routes we care about respond 200, plus a
# content-level check that the bundle vendors its dependencies locally and
# reaches no CDN (CSP-killer regression we've already hit once). Failure here
# is the cue to roll back · the deploy is already live at this point.
smoke-test:
  stage: deploy
  image: ${ALPINE_IMAGE}
  needs: [deploy]
  variables:
    SITE_URL: "https://rikiki.tordu-jardin.fr"
  before_script:
    - apk add --no-cache curl
  script:
    - |
      fail=0
      check() {
        local path="$1" expected="$2"
        local code
        code=$(curl -sk -o /tmp/body -w '%{http_code}' --max-time 15 "${SITE_URL}${path}") || code=000
        if [ "$code" != "$expected" ]; then
          echo "FAIL · ${path} · expected HTTP $expected, got $code"
          fail=1
        else
          echo "OK   · ${path} · HTTP $code"
        fi
      }
      check "/"                                "200"
      check "/docs/"                           "200"
      check "/docs/components/"                "200"
      check "/rikiki/dist/index.js"            "200"
      check "/rikiki/dist/vendor/marked.js"    "200"
      # The deployed bundle must import its vendored chunks relatively and reach
      # no CDN at all. Both halves are asserted: a missing relative import would
      # make the "no jsdelivr" half pass on an empty file.
      body=$(curl -sk --max-time 10 "${SITE_URL}/rikiki/dist/index.js")
      if echo "$body" | grep -q 'cdn\.jsdelivr\.net'; then
        echo "FAIL · index.js reaches cdn.jsdelivr.net"
        fail=1
      elif ! echo "$body" | grep -q './vendor/marked.js'; then
        echo "FAIL · index.js does not import ./vendor/marked.js · is this the right bundle?"
        fail=1
      else
        echo "OK   · index.js · vendored locally, no CDN"
      fi
      exit $fail
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Publish the npm package · triggered only by a vX.Y.Z tag. `prepublishOnly`
# rebuilds dist/ and runs the test suite, so a tag whose committed dist is
# stale (or whose version surfaces drifted) fails before anything is pushed to
# npm. Requires the masked CI variable NPM_TOKEN (an npm automation token).
#
# Tag a release with `git push --follow-tags`; the v-tag pipeline runs this job
# alone (every other job is gated on the default branch, not tags).
publish-npm:
  stage: release
  image: ${NODE_IMAGE}
  # A tag pipeline used to run this job alone · typecheck, lint, unit tests,
  # the dist/ drift guard and the browser suite were all skipped, so a tag on a
  # red commit published anyway. Every gate main runs, a tag now runs too.
  needs: [lint, package-check, e2e]
  before_script:
    - cd rikiki
    - npm ci --prefer-offline --no-audit
  script:
    - |
      [ -z "$NPM_TOKEN" ] && echo "ERROR: NPM_TOKEN is not set (CI/CD Variables, masked)." && exit 1
    - |
      # npm publishes package.json's version, not the tag · a mismatch would
      # ship something nobody asked for under a tag that says otherwise.
      manifest=$(node -p "require('./package.json').version")
      if [ "v$manifest" != "$CI_COMMIT_TAG" ]; then
        echo "ERROR: tag $CI_COMMIT_TAG does not match package.json version $manifest"
        exit 1
      fi
      echo "OK · tag matches package.json version $manifest"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
