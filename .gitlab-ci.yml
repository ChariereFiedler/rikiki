include:
  - project: tordu-jardin/cloud
    file: ci/deploy-static.gitlab-ci.yml

# Layout · the monorepo keeps the Astro site under site/, with public/
# symlinks back to the sibling rikiki/ and examples/ packages. The static
# template builds at BUILD_CONTEXT root, so a thin root package.json acts
# as the entry point for `COPY package.json package-lock.json && npm ci`
# (no deps · the root install is a no-op) and BUILD_CMD jumps into site/
# for the real build. BUILD_OUTPUT points at the nested dist/.
variables:
  STACK_NAME: 'rikiki'
  IMAGE_NAME: 'rikiki'
  NODE_VERSION: '24'
  # BUILD_CMD defaults to `npm run build` (template default) · the root
  # package.json's "build" script handles the cd-into-site dance. The old
  # post-step that swapped in the standalone Lit bundle is gone: dist/index.js
  # vendors its dependencies locally and no longer reaches any CDN.
  BUILD_OUTPUT: 'site/dist'
  # The site is statically generated, one file per route · an SPA fallback would
  # answer 200 with the homepage for every missing path, which makes every HTTP
  # check in smoke-test pass whatever is deployed.
  SPA_FALLBACK: 'false'
  # Base images pinned by sha256. Light supply-chain hygiene · a tag
  # refresh upstream no longer silently shifts the build under our feet.
  # Bump by hand when needed (run `docker pull <image>` to see the new
  # digest, paste it back here).
  NODE_IMAGE:  'node:24-alpine@sha256:d1b3b4da11eefd5941e7f0b9cf17783fc99d9c6fc34884a665f40a06dbdfc94f'
  NGINX_IMAGE: 'nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10'
  DOCKER_CLI_IMAGE: 'docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c'
  ALPINE_IMAGE: 'alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d'

stages: [check, build, deploy, release]

# Every job runs on the self-hosted runner, as it always has · said out loud
# now, because GitLab.com shared runners are enabled for the one job npm
# trusted publishing requires them for (publish-npm). Without this, any
# untagged job could land on a shared runner and spend the namespace's minutes.
default:
  tags: [self-hosted]

# Quality gate · em-dash linter + `astro check`. Runs before the (more
# expensive) Docker build so a TS error or a forbidden em-dash short-
# circuits the pipeline in ~25s instead of waiting for the Astro+Docker
# pass to fail much later.
lint:
  stage: check
  image: ${NODE_IMAGE}
  cache:
    key: site-node-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - site/node_modules/
  before_script:
    - cd site
    - npm ci --prefer-offline --no-audit
  script:
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Quality gate for the published npm package (the site job above only covers
# site/). Typecheck, lint (biome) and the consistency test suite. Runs in the
# same cheap `check` stage so a broken package short-circuits before the build.
package-check:
  stage: check
  image: ${NODE_IMAGE}
  cache:
    key: rikiki-node-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - rikiki/node_modules/
  before_script:
    # The release and bump tests drive real git repositories; NODE_IMAGE has no git.
    - apk add --no-cache git >/dev/null
    - cd rikiki
    - npm ci --prefer-offline --no-audit
  script:
    - npm run typecheck
    - npm run lint
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Lockfile drift guard · `npm ci` refuses a lock out of sync with package.json
# (EUSAGE), so package-check and e2e both die in their install step with a raw
# error buried in a heavy job. This runs the same coherence check on its own, in
# the cheap `check` stage, and fails fast with an actionable message before those
# jobs waste minutes installing. `--dry-run` validates package.json ↔ lock
# without writing node_modules; `--prefer-offline` skips re-resolving `^` ranges,
# so a patch published upstream between commit and run cannot make it flaky.
lockfile-sync:
  stage: check
  image: ${NODE_IMAGE}
  script:
    - cd rikiki
    - |
      npm ci --dry-run --prefer-offline --no-audit || {
        echo "ERROR · rikiki/package-lock.json drifted from rikiki/package.json"
        echo "Repair it: cd rikiki && npm install, then commit the updated package-lock.json"
        exit 1
      }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Render net · loads every fixture deck in a real browser and asserts the
# engine upgrades, slides render, navigation works and content has no JS errors.
# Also runs the offline-bundle, print/PDF and accessibility suites.
# Three engines: Chromium runs everything; Firefox and WebKit run the base
# contract (they skip print, which needs page.pdf, and the presenter, which
# needs the multi-screen APIs).
# Uses the official Playwright image for its browsers, pinned to the installed
# @playwright/test version. The static server is node (scripts/static-server.mjs).
e2e:
  stage: check
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  # The group's runner meant for browser suites, not the small shared VPS ·
  # there one Firefox process opening ~179 contexts died late in the run, a
  # different test every time and never on an assertion (#25).
  tags: [e2e]
  cache:
    key: rikiki-node-modules-${CI_COMMIT_REF_SLUG}
    paths:
      - rikiki/node_modules/
  before_script:
    # poppler reads the PDFs e2e/print.spec.ts produces · without it the print
    # contract would silently go untested in CI.
    - apt-get update -qq && apt-get install -y -qq poppler-utils
    - cd rikiki
    - npm ci --prefer-offline --no-audit
  script:
    - npm run build            # decks load ../../dist · build it first
    # The committed dist/ is what the deployed site and git consumers actually
    # run · a rebuild that differs means src/ and dist/ drifted, and the tests
    # below would green-light an artifact nobody ships. Fail fast instead.
    - git diff --exit-code -- dist || { echo "ERROR · committed dist/ is stale, run 'npm run build' and commit it"; exit 1; }
    # examples/*/index.html are generated single-file bundles served in
    # production · the same drift guard dist/ gets, for the same reason.
    - npm run examples -- --check
    # The root README is generated from README.template.md with measured
    # figures · the same drift guard dist/ and the examples get.
    - npm run readme -- --check
    - node scripts/release-smoke.mjs
    - npx playwright test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - rikiki/test-results/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Override the template's build-image job · the shared runner now selects
# the `docker-container` buildx driver by default, which does not load the
# built image into the local daemon. The template's plain `docker push`
# that follows then fails with "tag does not exist". We use `docker buildx
# build --push` so buildx pushes directly to the registry in one shot.
# The rest (image tags, build args, cache-from) is kept identical to the
# template so behaviour is otherwise unchanged.
build-image:
  stage: build
  image: ${DOCKER_CLI_IMAGE}
  variables:
    IMAGE: "${TJ_REGISTRY}/${IMAGE_NAME}"
    DOCKER_BUILDKIT: "1"
  before_script:
    - |
      for var in TJ_REGISTRY TJ_REGISTRY_USER TJ_REGISTRY_PASSWORD; do
        eval val=\$$var
        [ -z "$val" ] && echo "ERROR: $var is not set. Check runner config." && exit 1
      done
    - docker login "$TJ_REGISTRY" -u "$TJ_REGISTRY_USER" -p "$TJ_REGISTRY_PASSWORD"
  script:
    - |
      DOCKERFILE=".generated.Dockerfile"
      cat > "$DOCKERFILE" <<DOCKERFILE_EOF
      # syntax=docker/dockerfile:1
      FROM ${NODE_IMAGE} AS build
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN --mount=type=cache,target=/root/.npm npm ci
      COPY . .
      RUN ${BUILD_CMD}
      FROM ${NGINX_IMAGE}
      COPY --from=build /app/${BUILD_OUTPUT}/ /usr/share/nginx/html/
      RUN sed -i 's|application/javascript\s\+js;|application/javascript js mjs;|' /etc/nginx/mime.types
      DOCKERFILE_EOF
      cat >> "$DOCKERFILE" <<'SPA_EOF'
      COPY .cloud/nginx.conf /etc/nginx/conf.d/default.conf
      COPY scripts/check-static-http.sh /tmp/check-static-http.sh
      RUN nginx && sh /tmp/check-static-http.sh; result=$?; nginx -s quit; exit $result
      EXPOSE 80
      HEALTHCHECK --interval=30s --timeout=3s --retries=3 \
          CMD wget -qO- http://127.0.0.1/ || exit 1
      SPA_EOF
    - |
      CACHE_FLAG=""
      if [ "$DOCKER_NO_CACHE" != "true" ]; then
        CACHE_FLAG="--cache-from $IMAGE:latest"
      fi
    - docker buildx build
        $CACHE_FLAG
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg "COMMIT_SHA=$CI_COMMIT_SHORT_SHA"
        -f .generated.Dockerfile
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA"
        -t "$IMAGE:latest"
        --push
        .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Smoke test · after Portainer recreates the stack, hit the public URL
# from outside and assert the routes we care about respond 200, plus a
# content-level check that the bundle vendors its dependencies locally and
# reaches no CDN (CSP-killer regression we've already hit once). Failure here
# is the cue to roll back · the deploy is already live at this point.
smoke-test:
  stage: deploy
  image: ${ALPINE_IMAGE}
  needs: [deploy]
  variables:
    SITE_URL: "https://rikiki.tordu-jardin.fr"
  before_script:
    - apk add --no-cache curl
  script:
    - |
      fail=0
      check() {
        local path="$1" expected="$2"
        local code
        code=$(curl -sk -o /tmp/body -w '%{http_code}' --max-time 15 "${SITE_URL}${path}") || code=000
        if [ "$code" != "$expected" ]; then
          echo "FAIL · ${path} · expected HTTP $expected, got $code"
          fail=1
        else
          echo "OK   · ${path} · HTTP $code"
        fi
      }
      check "/__release_missing_route__/" "404"
      check "/rikiki/dist/__release_missing__.js" "404"
      check "/"                                "200"
      check "/docs/"                           "200"
      check "/docs/components/"                "200"
      check "/rikiki/dist/index.js"            "200"
      check "/rikiki/dist/vendor/marked.js"    "200"
      # The deployed bundle must import its vendored chunks relatively and reach
      # no CDN at all. Both halves are asserted: a missing relative import would
      # make the "no jsdelivr" half pass on an empty file.
      # Read the bundle from a file. Piping `echo "$body"` into `grep -q` was a
      # false negative on 0.7.0 while the import was there: under pipefail
      # grep -q closes the pipe as soon as it matches and echo's SIGPIPE fails
      # the pipeline, and some shells also rewrite backslash escapes in echo.
      curl -sk --max-time 10 -o /tmp/index.js "${SITE_URL}/rikiki/dist/index.js"
      if grep -q 'cdn\.jsdelivr\.net' /tmp/index.js; then
        echo "FAIL · index.js reaches cdn.jsdelivr.net"
        fail=1
      elif ! grep -q './vendor/marked.js' /tmp/index.js; then
        echo "FAIL · index.js does not import ./vendor/marked.js · is this the right bundle?"
        fail=1
      else
        echo "OK   · index.js · vendored locally, no CDN"
      fi
      exit $fail
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Publish the npm package · triggered only by a vX.Y.Z tag. `prepublishOnly`
# rebuilds dist/ and runs the test suite, so a tag whose committed dist is
# stale (or whose version surfaces drifted) fails before anything is pushed to
# npm.
#
# The tag is created by release:tag once the release MR is merged; the v-tag
# pipeline runs this job, by hand, after the package, browser,
# installed-tarball and site gates.
#
# No npm token anywhere · npm trusted publishing: npmjs.com trusts this
# project, this CI file and the `npm` environment, and the job proves who it
# is with an OIDC token. Provenance is signed on the way, for free. npm only
# accepts that proof from GitLab.com shared runners, hence the one job here
# that leaves the self-hosted runner. Needs npm >= 11.5.1 · NODE_IMAGE ships 11.12.
publish-npm:
  stage: release
  image: ${NODE_IMAGE}
  tags: [saas-linux-small-amd64]
  environment: npm
  id_tokens:
    NPM_ID_TOKEN:
      aud: npm:registry.npmjs.org
  # A tag pipeline used to run this job alone · typecheck, lint, unit tests,
  # the dist/ drift guard and the browser suite were all skipped, so a tag on a
  # red commit published anyway. Every gate main runs, a tag now runs too.
  needs: [lint, package-check, e2e, nginx-release-check]
  before_script:
    # prepublishOnly replays the unit suite, whose release tests need git.
    - apk add --no-cache git >/dev/null
    - cd rikiki
    - npm ci --prefer-offline --no-audit
  script:
    - |
      # npm publishes package.json's version, not the tag · a mismatch would
      # ship something nobody asked for under a tag that says otherwise.
      manifest=$(node -p "require('./package.json').version")
      if [ "v$manifest" != "$CI_COMMIT_TAG" ]; then
        echo "ERROR: tag $CI_COMMIT_TAG does not match package.json version $manifest"
        exit 1
      fi
      echo "OK · tag matches package.json version $manifest"
    - |
      # npm answers a republish with a bare 403 · say what happened instead.
      # Each script item is its own shell, so the version is read again here.
      manifest=$(node -p "require('./package.json').version")
      if npm view "rikiki-deck@${manifest}" version >/dev/null 2>&1; then
        echo "ERROR: rikiki-deck@${manifest} is already on npm · nothing to publish"
        exit 1
      fi
    - npm publish --access public
  # Second validation · the tag pipeline runs every gate, then waits here for
  # a human. The first validation was merging the release MR.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: false

# Release · proposed by CI, validated twice. See
# docs/superpowers/specs/2026-10-02-release-and-mirror-design.md.
.release-job:
  stage: release
  image: ${NODE_IMAGE}
  # RELEASE_TOKEN is scoped to this environment, so only these jobs receive
  # it · not lint, e2e or any job that runs dependencies' install scripts.
  environment:
    name: release
    action: prepare
  variables:
    # The decision reads every commit since the last tag.
    GIT_DEPTH: 0
    GIT_FETCH_EXTRA_FLAGS: --tags
  before_script:
    - apk add --no-cache git >/dev/null

release:propose:
  extends: .release-job
  needs: [smoke-test]
  # No npm ci · the bump and the decision import node: modules only, and
  # skipping it keeps third-party install scripts away from RELEASE_TOKEN.
  script:
    - node rikiki/scripts/release-ci.mjs propose
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:tag:
  extends: .release-job
  needs: [smoke-test]
  script:
    - node rikiki/scripts/release-ci.mjs tag
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:gitlab:
  extends: .release-job
  needs: [publish-npm]
  script:
    - node rikiki/scripts/release-ci.mjs gitlab-release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The push mirror runs on the push, not after this pipeline · start at once,
# and never hold the deploy: a red job here is the alarm, not a gate.
mirror-check:
  extends: .release-job
  needs: []
  allow_failure: true
  script:
    - node rikiki/scripts/release-ci.mjs mirror-check
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build the complete site on release tags as well as branches, before npm publish.
site-release-check:
  stage: check
  image: ${NODE_IMAGE}
  script:
    - cd site
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    expire_in: 1 week
    paths: [site/dist/]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

nginx-release-check:
  stage: build
  image: ${DOCKER_CLI_IMAGE}
  needs:
    - job: site-release-check
      artifacts: true
  script:
    - docker build -f .cloud/site-check.Dockerfile .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
