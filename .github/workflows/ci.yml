# The verification a contributor sees.
#
# Mirrors the `check` stage of .gitlab-ci.yml, which needs no secret and no
# self-hosted runner · it already ran on public images. Everything that needs
# a credential (the container registry, the Portainer redeploy) stays on
# GitLab, where the deployment lives; nothing here can be blocked by a
# credential a fork does not have.
#
# The one job that is NOT a copy is publish · see publish.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick second commit should cancel the previous run rather
# than race it · the 3-engine suite is 30 minutes of runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Quality gate · em-dash linter + `astro check`. First because a forbidden
  # dash or a TS error should short-circuit in seconds, not after the browser
  # matrix.
  site-lint:
    name: site · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: site
      - run: npm run lint
        working-directory: site

  # The published package · typecheck, biome, and the consistency suite that
  # holds every derived figure (sizes, component counts, the contract guards).
  package:
    name: package · typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rikiki/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: rikiki
      - run: npm run typecheck
        working-directory: rikiki
      - run: npm run lint
        working-directory: rikiki
      - run: npm test
        working-directory: rikiki

  # Render net · every fixture deck in a real browser, on three engines.
  # Chromium runs everything; Firefox and WebKit run the base contract.
  e2e:
    name: e2e · three engines
    runs-on: ubuntu-latest
    container:
      # Pinned to the installed @playwright/test version, as GitLab does.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      # The job runs as root inside the container while the runner keeps its
      # own HOME pointed at a directory root does not own. Chromium and WebKit
      # do not care; Firefox refuses to launch and says so:
      #   "Firefox is unable to launch if the $HOME folder isn't owned by the
      #    current user."
      # Every Firefox test then fails at browserType.launch, which reads like
      # 179 broken tests and is one wrong variable. Same shape as the
      # safe.directory step below · a container job inherits the runner's idea
      # of who it is.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      # This job runs in a container while the checkout belongs to the runner
      # user, so git refuses the working tree as dubiously owned · the drift
      # guards below are git commands and fail opaquely without this.
      - name: let git read a workspace it does not own
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rikiki/package-lock.json
      # poppler reads the PDFs e2e/print.spec.ts produces · without it the
      # print contract would silently go untested.
      - run: apt-get update -qq && apt-get install -y -qq poppler-utils
      - run: npm ci --prefer-offline --no-audit
        working-directory: rikiki
      # The decks load ../../dist · build before serving them.
      - run: npm run build
        working-directory: rikiki
      # The committed dist/ is what consumers actually run · a rebuild that
      # differs means src/ and dist/ drifted, and the tests below would
      # green-light an artifact nobody ships.
      # Names the files and writes them to the run summary before failing.
      # `git diff` alone dumps minified JavaScript into the log, which is
      # unreadable on the run page and useless in a bug report · the point of
      # a drift guard is to say WHAT drifted.
      - name: dist/ is in sync with src/
        run: |
          # Report git's own failure rather than swallowing it · the first run
          # of this workflow exited 129 here, which is a git usage error and
          # not a drift, and the bare command said nothing about which.
          # set +e around it on purpose: the job shell is `bash -eo pipefail`,
          # so a non-zero here would end the step before it can explain.
          set +e
          git diff --quiet -- dist
          status=$?
          set -e
          [ "$status" -eq 0 ] && exit 0
          if [ "$status" -ne 1 ]; then
            echo "git exited $status · this is not a drift, read the message above"
            exit "$status"
          fi
          {
            echo '### dist/ drifted from src/'
            echo
            echo '```'
            git diff --stat -- dist
            echo '```'
            echo
            echo 'File modes, in case the difference is only a permission bit:'
            echo '```'
            git diff --summary -- dist | head -20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        working-directory: rikiki
      # examples/*/index.html are generated single-file bundles served in
      # production · the same drift guard, for the same reason.
      - name: the committed examples are current
        run: npm run examples -- --check
        working-directory: rikiki
      # The root README is generated from README.template.md with measured
      # figures · the same drift guard, for the same reason.
      - name: the committed README is current
        run: npm run readme -- --check
        working-directory: rikiki
      - run: node scripts/release-smoke.mjs
        working-directory: rikiki
      - run: npx playwright test
        working-directory: rikiki
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: rikiki/test-results/
          retention-days: 7

  # The site builds, and the image that will serve it builds too. Both are
  # artifacts of the deploy, checked here so a broken one never reaches the
  # GitLab pipeline that ships it.
  site-build:
    name: site · build and serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: the nginx image builds around it
        run: docker build -f .cloud/site-check.Dockerfile .
