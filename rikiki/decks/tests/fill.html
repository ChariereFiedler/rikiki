<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rikiki · fill and spread harness</title>
<link rel="stylesheet" href="../../themes/rikiki.css">
<script type="module" src="../../dist/index.js"></script>
</head>
<body>
<!-- Vertical distribution · a short slide left ~60% of the canvas empty.
     `spread` shares that space between the blocks, `fill` gives it to them. -->
<deck-root no-hint no-arrows>

  <deck-feature id="plain" eyebrow="reveals">
    <h1 slot="title">Stacked at the top</h1>
    <p id="plain-a">First line...</p>
    <p id="plain-b">...second...</p>
    <p id="plain-c">...third.</p>
  </deck-feature>

  <deck-feature id="spread" eyebrow="reveals" spread="between">
    <h1 slot="title">Spread between</h1>
    <p id="spread-a">First line...</p>
    <p id="spread-b">...second...</p>
    <p id="spread-c">...third.</p>
  </deck-feature>

  <deck-feature id="filled" eyebrow="reveals" fill>
    <h1 slot="title">Filled</h1>
    <deck-fit id="fill-a" max="5">First line...</deck-fit>
    <deck-fit id="fill-b" max="5">...second...</deck-fit>
  </deck-feature>

  <deck-feature id="bogus" eyebrow="reveals" spread="nope">
    <h1 slot="title">Unknown spread</h1>
    <p id="bogus-a">Falls back to the top-aligned default.</p>
    <p id="bogus-b">It must not drop the layout.</p>
  </deck-feature>

  <!-- A split asking to be centred · its columns are short, so a spread that
       works moves them down and one that does not leaves them at the top. The
       assertion in e2e/ink.spec.ts is falsifiable only against a case like
       this: deck-split's .body is a grid, so justify-content on it distributes
       COLUMNS, and the vertical distribution belongs to each .col. -->
  <deck-split id="split-center" eyebrow="reveals" spread="center">
    <h1 slot="title">Centred columns</h1>
    <div id="sc-left" slot="left"><p>A short left column.</p></div>
    <div id="sc-right" slot="right"><p>A short right column.</p></div>
  </deck-split>

</deck-root>
</body>
</html>
