<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagramme · courbes · fixture de test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../themes/rikiki.css">
<script type="module" src="../../dist/index.js"></script>
<script type="module" src="../../dist/deck-diagram.js"></script>
</head>
<body>
<!-- Deux séries lues comme une forme, écrites sans coordonnée · e2e/diagram.spec.ts la lit. -->
<deck-root>

  <deck-feature id="decolle" eyebrow="performance · le coude">
    <h1 slot="title">La latence décolle à 70 %</h1>
    <deck-diagram data-testid="decolle">
      <dg-curve name="latence" label="Latence selon la charge" values="120 125 130 140 160 210 330 610" max="800" unit="ms" threshold="300" ticks="10% 20% 30% 40% 50% 60% 70% 80%" emphasis></dg-curve>
    </deck-diagram>
    <deck-source>Illustration · chiffres inventés</deck-source>
  </deck-feature>

  <deck-feature id="plafond" eyebrow="produit · la saturation">
    <h1 slot="title">L'adoption plafonne à 60 %</h1>
    <deck-diagram data-testid="plafond">
      <dg-state>
        <dg-curve name="adoption" label="Comptes actifs" values="2 6 15 31 46 55 59 60" max="100" unit="%" ticks="janvier août" emphasis></dg-curve>
      </dg-state>
      <dg-state step="1">
        <dg-group layout="row" gap="airy">
          <dg-curve name="adoption" label="Comptes actifs" values="2 6 15 31 46 55 59 60" max="100" unit="%" ticks="janvier août"></dg-curve>
          <dg-box name="reste" icon="lock" label="40 % dehors" note="pas de SSO" emphasis></dg-box>
        </dg-group>
      </dg-state>
    </deck-diagram>
    <deck-source>Illustration · chiffres inventés</deck-source>
  </deck-feature>

</deck-root>
</body>
</html>
