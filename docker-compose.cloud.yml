services:
  rikiki-site:
    image: registry.tordu-jardin.fr/rikiki:latest
    container_name: rikiki-site
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.rikiki-site.rule=Host(`rikiki.tordu-jardin.fr`)
      - traefik.http.routers.rikiki-site.entrypoints=websecure
      - traefik.http.routers.rikiki-site.tls.certresolver=letsencrypt
      - traefik.http.services.rikiki-site.loadbalancer.server.port=80
      - traefik.http.routers.rikiki-site.middlewares=security-headers@file
    healthcheck:
      # /etc/hosts maps both 127.0.0.1 and ::1 to `localhost` · Alpine wget
      # tries IPv6 first and nginx only listens on 0.0.0.0:80, so
      # `http://localhost/` returns connection refused. Use the literal
      # IPv4 to keep the healthcheck deterministic.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
