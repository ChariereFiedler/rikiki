server {
    listen 80;
    root /usr/share/nginx/html;

    # Text responses declare their encoding. Without it a UTF-8 .md or .txt
    # is decoded as Latin-1 by the browser (a middle dot came out as "Â·" on
    # the published LLM docs, 2026-09-12). charset_types widens nginx's
    # default list to the text types this site serves.
    charset utf-8;
    charset_types text/html text/plain text/css text/markdown
                  application/javascript application/json image/svg+xml;

    # nginx's mime map has no entry for .md, so it fell back to
    # application/octet-stream; an empty `types` scoped to the location keeps
    # the global map intact everywhere else.
    location ~ \.md$ {
        types {}
        default_type text/markdown;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
