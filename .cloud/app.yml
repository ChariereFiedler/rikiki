apiVersion: '1'
name: rikiki
domain: 'rikiki.tordu-jardin.fr'
port: 80

resources:
  cpus: '0.2'
  memory: 64M
  memory_swap: 128M

deploy:
  strategy: recreate
  healthcheck:
    path: /
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

database:
  enabled: false

monitoring:
  metrics:
    enabled: false
  dashboards: false
  alerts: false

sso:
  type: none

uptime:
  enabled: true
  path: /

env: {}
secrets: {}
volumes: []
hooks:
  post_deploy: ''
registry:
  retention: 5
networks: []
